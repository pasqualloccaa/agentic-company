# Governance rules enforced at runtime by gates.py (phase 1).
# Texts are Italian because the agents read them in gate messages.

board:
  meeting_every_weeks: 4            # the board meets after the close of weeks 4, 8, ...

delegation:                          # powers of management (Uffici, AD Luca Ferrara)
  spend_board_threshold: 100_000     # cumulative per counterparty since the last board meeting
  price_change_max_pct: 0.05         # cumulative per customer vs the last board-approved price
  new_debt: board                    # any new borrowing needs the board

related_parties:                     # always go to the board (art. 2391-bis c.c.)
  surnames: [valsecchi]              # matched as whole words: "Valsecchia" does not match
  people:
    - {name: Giulia Valsecchi, relation: famiglia Valsecchi, socia di maggioranza}
    - {name: Marco Valsecchi, relation: famiglia Valsecchi, figlio dei soci}

law:
  # distributions to shareholders are reserved to the shareholders' meeting (art. 2433 c.c.)
  distribution_keywords: [dividend, dividendo, dividendi, distribuzione utili, acconto utili]

roles:
  uffici:
    name: Uffici (AD Luca Ferrara)
    tools: [read_ledger, get_kpis, present_board_report, set_price, approve_spend,
            announce_to_staff, declare_conflict, write_diary]
  cda:
    name: Consiglio di amministrazione (presidente Giorgio Martinelli)
    tools: [deliberate, declare_conflict, write_diary]
